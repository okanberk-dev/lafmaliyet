# Claude ile PR incelemesi (anthropics/claude-code-action). Codex'in kullanım sınırı dolunca yerine kuruldu.
# Gerekenler: depo sırrı ANTHROPIC_API_KEY (ya da Claude Pro/Max için `claude setup-token` ile
# CLAUDE_CODE_OAUTH_TOKEN) ve depoda kurulu Claude GitHub uygulaması (https://github.com/apps/claude).
# Maliyet: inceleme her push'ta değil, PR açılınca / taslaktan çıkınca / yeniden açılınca çalışır; yeniden
# inceleme için PR'a "@claude" yazın. İş akışı kodu değiştiremez (contents: read), yalnız yorum yazar.
name: Claude ile PR incelemesi

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-inceleme-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  inceleme:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Bu PR'ı incele. Proje: L'Affogato kafesinin maliyet paneli (Next.js 16 App Router, React 19,
            Drizzle + Postgres, Vercel). Önce AGENTS.md'yi oku: bu Next.js sürümü eğitim verindekinden farklı.
            Planlar ve kurallar docs/planlar/ altında (CRITIQUE.md, CRITIQUE2.md).

            Yalnız gerçek sorunları bildir:
            - hata ve yanlış hesap (somut girdiyle ne yanlış çıktığını yaz),
            - var olan özelliklerde gerileme,
            - güvenlik ve KVKK (yetki; personelin maliyet, maaş, kâr ve karaoke tutarlarını görmemesi; sırlar),
            - veri kaybı ve migration sorunları (birleştirmede yeniden üretme kuralı R2, journal sırası),
            - telefonda (390 px) bozulan arayüz, yanıltıcı ya da doğal olmayan Türkçe metin.
            Biçim ve zevk konularını yazma; depo prettier ile biçimlenmez. Bulgu yoksa bunu kısaca söyle.

            Yorumları Türkçe, kısa ve sade yaz. Genel değerlendirme için `gh pr comment`, satıra özel
            sorunlar için `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`) kullan.
            Yalnız GitHub yorumu bırak.
            Not: PR dalı çalışma klasöründe açık.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # PR'daki "@claude …" yorumlarına yanıt (yeniden inceleme ya da soru). Yalnız yazma yetkisi olanlar tetikler
  # (eylemin varsayılanı); kod değiştirmez.
  yanit:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
