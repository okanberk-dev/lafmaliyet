# Sürekli entegrasyon: her PR'da ve main'e doğrudan push'ta tip denetimi, ESLint, testler (başlangıç verisiyle altın
# karşılaştırması dahil, tests/*.test.ts), geçici Postgres'te veritabanı testleri (npm run test:db) ve production
# derlemesi.
#
# Derleme `npm run build` ile değil `next build` ile alınır: `npm run build` önce scripts/predeploy.ts ile veritabanına
# migration uygular (boş yerel veritabanına başlangıç verisini de yükler); CI canlı ya da kalıcı hiçbir veritabanına
# dokunmaz. Aşağıdaki ortam değişkenleri yalnız yer tutucudur, gerçek sırlar Vercel'de kalır.
#
# Squash merge edilen PR'ın ağacı PR'da zaten denendi; main'de "(#N)" başlıklı commit'te iş atlanır (atlanan iş
# Actions dakikası harcamaz). "(#" içermeyen doğrudan push yine denenir.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  denetim:
    name: Tip · Lint · Test · Derleme
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-yer-tutucu-oturum-anahtari-canlida-kullanilmaz
      APP_URL: https://ladmin.laffogato.net
    # Veritabanı testleri için geçici Postgres 16 (yalnız bu iş boyunca yaşar). DATABASE_URL'deki "ci" veritabanı
    # açılmaz: derleme yine hiçbir veritabanına dokunmaz; testler yalnız TEST_DATABASE_URL'i görür.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      # Vercel'deki sürümle aynı (package.json › engines.node 24.x).
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund

      # PageProps / LayoutProps gibi global tipler .next/types altında üretilir (next dev / build bunu kendisi
      # yapar); temiz checkout'ta tsc'den önce üretilmezse "Cannot find name 'PageProps'" der.
      - name: Rota tipleri (next typegen)
        run: npx next typegen

      - name: Tip denetimi
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Testler
        run: npm test

      # `npm test` veritabanı testlerini atlar (değişkenleri yok); burada hepsi geçici Postgres'te sırayla koşar
      # (scripts/test-db.ts: migration'lar, tohum, dosya başına süre sınırı).
      - name: Veritabanı testleri
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/test
          TEST_DB_FILE_TIMEOUT_MS: "120000"

      - name: Derleme (next build)
        run: npx next build
